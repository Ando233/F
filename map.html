<!doctype html>
<html>
<head>
    <meta charset="utf-8">
    <title>V2X Route Planning</title>
    <meta name="viewport" content="initial-scale=1.0, user-scalable=no, width=device-width">

    <style>
        html, body, #container {
            width: 100%;
            height: 100%;
            margin: 0;
            padding: 0;
        }

        #tip {
            position: absolute;
            top: 10px;
            left: 10px;
            z-index: 999;
            background: white;
            padding: 10px 14px;
            border-radius: 6px;
            font-size: 14px;
            line-height: 22px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.25);
            max-width: 360px;
        }

        .amap-marker-label {
            border: 1px solid #999;
            background: white;
            padding: 3px 6px;
            border-radius: 4px;
            font-size: 12px;
        }
    </style>

    <!-- 加载高德地图 JS API，并启用驾车路径规划插件 -->
    <script src="https://webapi.amap.com/maps?v=2.0&key=10ce72d3ed7b315bffe56bb7eb97f106&plugin=AMap.Driving"></script>
</head>

<body>
<div id="container"></div>
<div id="tip">Click the map to select the start point.</div>

<script>
    // 创建地图，默认定位到北方工业大学附近
    var map = new AMap.Map('container', {
        zoom: 16,
        center: [116.206490, 39.929413],
        resizeEnable: true
    });

    var startPoint = null;
    var endPoint = null;

    var startMarker = null;
    var endMarker = null;

    var tip = document.getElementById("tip");

    // 创建驾车路线规划对象
    var driving = new AMap.Driving({
        map: map,
        policy: AMap.DrivingPolicy.LEAST_TIME
    });

    // 点击地图选择起点和终点
    map.on('click', function (e) {
        var lng = e.lnglat.getLng();
        var lat = e.lnglat.getLat();
        var point = [lng, lat];

        // 第一次点击：设置起点
        if (startPoint === null) {
            startPoint = point;

            startMarker = new AMap.Marker({
                position: startPoint,
                map: map,
                label: {
                    content: "Start",
                    direction: "top"
                }
            });

            tip.innerHTML =
                "Start point selected:<br>" +
                lng.toFixed(6) + ", " + lat.toFixed(6) +
                "<br><br>Click the map to select the end point.";

            return;
        }

        // 第二次点击：设置终点，并进行路径规划
        if (endPoint === null) {
            endPoint = point;

            endMarker = new AMap.Marker({
                position: endPoint,
                map: map,
                label: {
                    content: "End",
                    direction: "top"
                }
            });

            tip.innerHTML = "Planning route...";

            driving.search(startPoint, endPoint, function (status, result) {
                if (status === 'complete') {
                    tip.innerHTML =
                        "Route planning succeeded.<br>" +
                        "Start: " + startPoint[0].toFixed(6) + ", " + startPoint[1].toFixed(6) + "<br>" +
                        "End: " + endPoint[0].toFixed(6) + ", " + endPoint[1].toFixed(6) + "<br><br>" +
                        "Click again to reset.";
                } else {
                    var errorInfo = "";

                    if (result && result.info) {
                        errorInfo = result.info;
                    } else if (result && result.message) {
                        errorInfo = result.message;
                    } else if (result) {
                        errorInfo = JSON.stringify(result);
                    } else {
                        errorInfo = "Unknown error";
                    }

                    tip.innerHTML =
                        "Route planning failed.<br>" +
                        "Status: " + status + "<br>" +
                        "Info: " + errorInfo + "<br><br>" +
                        "Try selecting points on main roads.";

                    console.log("Route planning failed.");
                    console.log("Status:", status);
                    console.log("Result:", result);
                }
            });

            return;
        }

        // 第三次点击：清空旧路径，重新设置起点
        map.clearMap();
        driving.clear();

        startPoint = point;
        endPoint = null;

        startMarker = new AMap.Marker({
            position: startPoint,
            map: map,
            label: {
                content: "Start",
                direction: "top"
            }
        });

        tip.innerHTML =
            "New start point selected:<br>" +
            lng.toFixed(6) + ", " + lat.toFixed(6) +
            "<br><br>Click the map to select the end point.";
    });
</script>
</body>
</html>
